<!doctype html><meta charset="utf-8"><title>原创釉面砖与石纹</title><style>body{font:16px/1.8 system-ui;max-width:800px;margin:40px auto}</style><h1>原创材质</h1><p>清洁釉面方砖：包括釉面微起伏、圆角砖边、下凹填缝和不同表面粗糙度。默认每片 1 米贴图包含 8×8 块砖；地面灰砖使用 4.8 米尺度，单块约 60 cm。</p><p>浅色抛光石纹：多尺度连续矿物纹路，包含颜色、细微凹凸和粗糙度通道。它是通用材质设计，不指代天然石板或特定品牌。</p><p>两类贴图均为本项目程序生成，源脚本 tools/build-clean-finishes.py。可以随项目离线使用。</p>
